<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>荣耀·真实功能应用</title>
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'HarmonyOS Sans', system-ui, -apple-system, sans-serif;
            background: #0a0e1a;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #fff;
        }

        /* ===== 状态栏 ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px 6px 20px;
            font-size: 13px;
            font-weight: 500;
            flex-shrink: 0;
            z-index: 10;
        }
        .status-left .time {
            font-weight: 600;
            font-size: 15px;
        }
        .status-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .battery-body {
            width: 24px;
            height: 12px;
            border: 1.5px solid rgba(255,255,255,0.7);
            border-radius: 3px;
            padding: 1px;
            position: relative;
        }
        .battery-body::after {
            content: '';
            position: absolute;
            right: -4px;
            top: 2px;
            width: 2px;
            height: 6px;
            background: rgba(255,255,255,0.7);
            border-radius: 0 2px 2px 0;
        }
        .battery-level {
            height: 100%;
            width: 72%;
            background: #4caf50;
            border-radius: 1px;
        }

        /* ===== 桌面 ===== */
        .desktop {
            flex: 1;
            padding: 10px 16px 0 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .desktop::-webkit-scrollbar {
            width: 0;
        }
        .icon-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px 8px;
            justify-items: center;
        }
        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 16px;
            transition: background 0.2s;
            width: 100%;
            max-width: 80px;
            -webkit-tap-highlight-color: transparent;
        }
        .icon-item:active {
            background: rgba(255,255,255,0.12);
        }
        .icon-item .app-icon {
            width: 58px;
            height: 58px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
            transition: transform 0.15s;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .icon-item:active .app-icon {
            transform: scale(0.88);
        }
        .icon-item .app-name {
            font-size: 11px;
            color: rgba(255,255,255,0.88);
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* ===== Dock ===== */
        .dock {
            flex-shrink: 0;
            padding: 12px 20px 10px 20px;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-around;
            border-radius: 28px 28px 0 0;
            margin: 0 8px;
        }
        .dock .dock-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        .dock .dock-item:active {
            background: rgba(255,255,255,0.10);
        }
        .dock .dock-item .dock-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: rgba(255,255,255,0.05);
            transition: transform 0.15s;
        }
        .dock .dock-item:active .dock-icon {
            transform: scale(0.85);
        }
        .dock .dock-item .dock-name {
            font-size: 10px;
            color: rgba(255,255,255,0.7);
        }

        /* ===== 导航条 ===== */
        .nav-bar {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 6px 0 14px 0;
            gap: 28px;
        }
        .nav-bar .home-indicator {
            width: 134px;
            height: 5px;
            background: rgba(255,255,255,0.25);
            border-radius: 20px;
        }

        /* ===== 应用容器（全屏切换） ===== */
        .app-container {
            position: fixed;
            inset: 0;
            background: #0f1322;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transform: scale(0.92) translateY(30px);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
            border-radius: 24px;
            overflow: hidden;
        }
        .app-container.active {
            transform: scale(1) translateY(0);
            opacity: 1;
            pointer-events: auto;
            border-radius: 0;
        }

        .app-header {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
            gap: 12px;
        }
        .app-header .back-btn {
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            -webkit-tap-highlight-color: transparent;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .app-header .back-btn:active {
            opacity: 1;
        }
        .app-header .app-title {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
        }

        .app-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .app-body::-webkit-scrollbar {
            width: 0;
        }

        /* ===== 计算器 ===== */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 360px;
            margin: 0 auto;
            width: 100%;
        }
        .calc-grid button {
            padding: 18px 0;
            border: none;
            border-radius: 16px;
            font-size: 24px;
            font-weight: 500;
            background: rgba(255,255,255,0.08);
            color: #fff;
            cursor: pointer;
            transition: background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .calc-grid button:active {
            background: rgba(255,255,255,0.20);
        }
        .calc-grid .op {
            background: rgba(99, 102, 241, 0.35);
        }
        .calc-grid .op:active {
            background: rgba(99, 102, 241, 0.55);
        }
        .calc-grid .equal {
            background: #6366f1;
        }
        .calc-grid .equal:active {
            background: #818cf8;
        }
        .calc-display {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            text-align: right;
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 1px;
            min-height: 80px;
            word-break: break-all;
            max-width: 360px;
            margin: 0 auto 8px auto;
            width: 100%;
        }

        /* ===== 备忘录 ===== */
        .memo-input-row {
            display: flex;
            gap: 10px;
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }
        .memo-input-row input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .memo-input-row input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .memo-input-row button {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background: #6366f1;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .memo-input-row button:active {
            opacity: 0.7;
        }
        .memo-list {
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .memo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border-left: 3px solid #6366f1;
        }
        .memo-item .del-btn {
            background: none;
            border: none;
            color: #f87171;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            -webkit-tap-highlight-color: transparent;
        }
        .memo-item .del-btn:active {
            opacity: 0.5;
        }
        .memo-empty {
            text-align: center;
            color: rgba(255,255,255,0.25);
            padding: 30px 0;
        }

        /* ===== 时钟 ===== */
        .clock-big {
            font-size: 64px;
            font-weight: 300;
            text-align: center;
            letter-spacing: 4px;
            padding: 20px 0;
        }
        .clock-date {
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 18px;
        }
        .stopwatch-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .stopwatch-row button {
            padding: 12px 28px;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 500;
            background: rgba(255,255,255,0.08);
            color: #fff;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .stopwatch-row button:active {
            opacity: 0.6;
        }
        .stopwatch-row .sw-start {
            background: #22c55e;
        }
        .stopwatch-row .sw-stop {
            background: #ef4444;
        }
        .stopwatch-row .sw-reset {
            background: rgba(255,255,255,0.15);
        }

        /* ===== 天气 ===== */
        .weather-main {
            text-align: center;
            padding: 10px 0;
        }
        .weather-main .temp {
            font-size: 56px;
            font-weight: 300;
        }
        .weather-main .desc {
            font-size: 20px;
            color: rgba(255,255,255,0.6);
        }
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }
        .weather-grid .day {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px 0;
            text-align: center;
        }
        .weather-grid .day .day-name {
            font-size: 14px;
            opacity: 0.6;
        }
        .weather-grid .day .day-icon {
            font-size: 28px;
            margin: 6px 0;
        }
        .weather-grid .day .day-temp {
            font-size: 16px;
        }

        /* ===== 图库 ===== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }
        .gallery-grid .photo {
            aspect-ratio: 1/1;
            border-radius: 16px;
            background: rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            cursor: pointer;
            transition: transform 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .gallery-grid .photo:active {
            transform: scale(0.92);
        }
        .gallery-preview {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }
        .gallery-preview.active {
            opacity: 1;
            pointer-events: auto;
        }
        .gallery-preview .big-photo {
            font-size: 120px;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .gallery-preview.active .big-photo {
            transform: scale(1);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 380px) {
            .icon-item .app-icon {
                width: 50px;
                height: 50px;
                font-size: 26px;
            }
            .dock .dock-item .dock-icon {
                width: 38px;
                height: 38px;
                font-size: 20px;
            }
            .calc-grid button {
                padding: 14px 0;
                font-size: 20px;
            }
            .clock-big {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 状态栏 ===== -->
    <div class="status-bar">
        <div class="status-left"><span class="time" id="clock">12:00</span></div>
        <div class="status-right">
            <span>📶</span><span>📶</span><span>🔊</span>
            <span class="battery"><span class="battery-body"><span class="battery-level"></span></span></span>
        </div>
    </div>

    <!-- ===== 桌面 ===== -->
    <div class="desktop" id="desktop">
        <div class="icon-row">
            <div class="icon-item" data-app="计算器"><div class="app-icon" style="background:linear-gradient(135deg,#4facfe,#00f2fe);">🧮</div><span class="app-name">计算器</span></div>
            <div class="icon-item" data-app="备忘录"><div class="app-icon" style="background:linear-gradient(135deg,#a18cd1,#fbc2eb);">📝</div><span class="app-name">备忘录</span></div>
            <div class="icon-item" data-app="时钟"><div class="app-icon" style="background:linear-gradient(135deg,#f093fb,#f5576c);">🕐</div><span class="app-name">时钟</span></div>
            <div class="icon-item" data-app="天气"><div class="app-icon" style="background:linear-gradient(135deg,#fccb90,#d57eeb);">🌤️</div><span class="app-name">天气</span></div>
        </div>
        <div class="icon-row">
            <div class="icon-item" data-app="图库"><div class="app-icon" style="background:linear-gradient(135deg,#43e97b,#38f9d7);">🖼️</div><span class="app-name">图库</span></div>
            <div class="icon-item" data-app="设置"><div class="app-icon" style="background:linear-gradient(135deg,#89f7fe,#66a6ff);">⚙️</div><span class="app-name">设置</span></div>
            <div class="icon-item" data-app="音乐"><div class="app-icon" style="background:linear-gradient(135deg,#fa709a,#fee140);">🎵</div><span class="app-name">音乐</span></div>
            <div class="icon-item" data-app="相机"><div class="app-icon" style="background:linear-gradient(135deg,#ffecd2,#fcb69f);">📷</div><span class="app-name">相机</span></div>
        </div>
        <div class="icon-row">
            <div class="icon-item" data-app="文件管理"><div class="app-icon" style="background:linear-gradient(135deg,#a8edea,#fed6e3);">📁</div><span class="app-name">文件管理</span></div>
            <div class="icon-item" data-app="浏览器"><div class="app-icon" style="background:linear-gradient(135deg,#a1c4fd,#c2e9fb);">🌐</div><span class="app-name">浏览器</span></div>
            <div class="icon-item" data-app="应用市场"><div class="app-icon" style="background:linear-gradient(135deg,#d4fc79,#96e6a1);">📦</div><span class="app-name">应用市场</span></div>
            <div class="icon-item" data-app="健康"><div class="app-icon" style="background:linear-gradient(135deg,#f6d365,#fda085);">❤️</div><span class="app-name">健康</span></div>
        </div>
    </div>

    <!-- ===== Dock ===== -->
    <div class="dock">
        <div class="dock-item" data-app="电话"><div class="dock-icon" style="background:linear-gradient(135deg,#4facfe,#00f2fe);">📞</div><span class="dock-name">电话</span></div>
        <div class="dock-item" data-app="信息"><div class="dock-icon" style="background:linear-gradient(135deg,#43e97b,#38f9d7);">💬</div><span class="dock-name">信息</span></div>
        <div class="dock-item" data-app="浏览器"><div class="dock-icon" style="background:linear-gradient(135deg,#fa709a,#fee140);">🌐</div><span class="dock-name">浏览器</span></div>
        <div class="dock-item" data-app="相机"><div class="dock-icon" style="background:linear-gradient(135deg,#f093fb,#f5576c);">📷</div><span class="dock-name">相机</span></div>
    </div>

    <div class="nav-bar"><div class="home-indicator"></div></div>

    <!-- ===== 应用容器 ===== -->
    <div class="app-container" id="appContainer">
        <div class="app-header">
            <span class="back-btn" id="backBtn">‹</span>
            <span class="app-title" id="appTitle">应用</span>
            <span style="width:32px;"></span>
        </div>
        <div class="app-body" id="appBody">
            <!-- 由 JS 动态渲染 -->
        </div>
    </div>

    <!-- ===== 图库预览弹窗 ===== -->
    <div class="gallery-preview" id="galleryPreview">
        <div class="big-photo" id="previewEmoji">📷</div>
    </div>

    <script>
        // ============================================================
        //  1. 时钟
        // ============================================================
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        }
        updateClock();
        setInterval(updateClock, 10000);

        // ============================================================
        //  2. 应用路由
        // ============================================================
        const container = document.getElementById('appContainer');
        const appTitle = document.getElementById('appTitle');
        const appBody = document.getElementById('appBody');
        const backBtn = document.getElementById('backBtn');

        let currentApp = null;

        // ---- 各应用渲染函数 ----
        const appRenderers = {

            // ---------- 计算器 ----------
            '计算器': function() {
                let expr = '';
                let result = '0';
                const display = document.createElement('div');
                display.className = 'calc-display';
                display.textContent = '0';

                const grid = document.createElement('div');
                grid.className = 'calc-grid';

                const btns = [
                    'C', '±', '%', '÷',
                    '7', '8', '9', '×',
                    '4', '5', '6', '−',
                    '1', '2', '3', '+',
                    '0', '.', '⌫', '='
                ];

                const ops = ['÷', '×', '−', '+'];
                const isOp = (v) => ops.includes(v);

                btns.forEach(label => {
                    const btn = document.createElement('button');
                    btn.textContent = label;
                    if (isOp(label)) btn.className = 'op';
                    if (label === '=') btn.className = 'equal';
                    if (label === 'C' || label === '⌫') btn.style.background = 'rgba(239,68,68,0.25)';

                    btn.addEventListener('click', function() {
                        const val = this.textContent;
                        if (val === 'C') { expr = '';
                            result = '0';
                            display.textContent = '0'; return; }
                        if (val === '⌫') { expr = expr.slice(0, -1);
                            display.textContent = expr || '0'; return; }
                        if (val === '±') {
                            if (expr.startsWith('-')) expr = expr.slice(1);
                            else if (expr && expr !== '0') expr = '-' + expr;
                            display.textContent = expr || '0';
                            return;
                        }
                        if (val === '=') {
                            try {
                                const sanitized = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
                                const res = Function('"use strict"; return (' + sanitized + ')')();
                                result = String(parseFloat(res.toFixed(10)));
                                display.textContent = result;
                                expr = result;
                            } catch { display.textContent = '错误';
                                expr = ''; }
                            return;
                        }
                        // 防止连续运算符
                        if (isOp(val) && isOp(expr.slice(-1))) {
                            expr = expr.slice(0, -1) + val;
                        } else {
                            expr += val;
                        }
                        display.textContent = expr;
                    });
                    grid.appendChild(btn);
                });

                appBody.appendChild(display);
                appBody.appendChild(grid);
            },

            // ---------- 备忘录 ----------
            '备忘录': function() {
                let memos = JSON.parse(localStorage.getItem('memos') || '[]');

                const inputRow = document.createElement('div');
                inputRow.className = 'memo-input-row';
                const input = document.createElement('input');
                input.placeholder = '写一条备忘录...';
                const addBtn = document.createElement('button');
                addBtn.textContent = '添加';

                const list = document.createElement('div');
                list.className = 'memo-list';

                function renderList() {
                    list.innerHTML = '';
                    if (memos.length === 0) {
                        list.innerHTML = '<div class="memo-empty">📭 暂无备忘录</div>';
                        return;
                    }
                    memos.forEach((text, idx) => {
                        const item = document.createElement('div');
                        item.className = 'memo-item';
                        item.innerHTML = `<span>${text}</span><button class="del-btn" data-idx="${idx}">✕</button>`;
                        item.querySelector('.del-btn').addEventListener('click', function() {
                            memos.splice(parseInt(this.dataset.idx), 1);
                            localStorage.setItem('memos', JSON.stringify(memos));
                            renderList();
                        });
                        list.appendChild(item);
                    });
                }

                addBtn.addEventListener('click', function() {
                    const val = input.value.trim();
                    if (!val) return;
                    memos.push(val);
                    localStorage.setItem('memos', JSON.stringify(memos));
                    input.value = '';
                    renderList();
                });
                input.addEventListener('keydown', e => { if (e.key === 'Enter') addBtn.click(); });

                inputRow.appendChild(input);
                inputRow.appendChild(addBtn);
                appBody.appendChild(inputRow);
                appBody.appendChild(list);
                renderList();
            },

            // ---------- 时钟 ----------
            '时钟': function() {
                let swTime = 0,
                    swInterval = null,
                    swRunning = false;

                const clockDiv = document.createElement('div');
                clockDiv.className = 'clock-big';
                const dateDiv = document.createElement('div');
                dateDiv.className = 'clock-date';

                function updateDigital() {
                    const now = new Date();
                    clockDiv.textContent =
                        String(now.getHours()).padStart(2, '0') + ':' +
                        String(now.getMinutes()).padStart(2, '0') + ':' +
                        String(now.getSeconds()).padStart(2, '0');
                    dateDiv.textContent = now.toLocaleDateString('zh-CN', { weekday: 'long', year: 'numeric',
                        month: 'long', day: 'numeric' });
                }
                updateDigital();
                setInterval(updateDigital, 1000);

                const swDisplay = document.createElement('div');
                swDisplay.className = 'clock-big';
                swDisplay.style.fontSize = '40px';
                swDisplay.textContent = '00:00.0';

                function formatSW(ms) {
                    const sec = Math.floor(ms / 1000);
                    const min = Math.floor(sec / 60);
                    const s = sec % 60;
                    const ds = Math.floor((ms % 1000) / 100);
                    return String(min).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + ds;
                }

                const swRow = document.createElement('div');
                swRow.className = 'stopwatch-row';
                const startBtn = document.createElement('button');
                startBtn.className = 'sw-start';
                startBtn.textContent = '▶ 开始';
                const stopBtn = document.createElement('button');
                stopBtn.className = 'sw-stop';
                stopBtn.textContent = '⏹ 停止';
                const resetBtn = document.createElement('button');
                resetBtn.className = 'sw-reset';
                resetBtn.textContent = '↺ 重置';

                startBtn.addEventListener('click', function() {
                    if (swRunning) return;
                    swRunning = true;
                    const startTime = Date.now() - swTime;
                    swInterval = setInterval(() => {
                        swTime = Date.now() - startTime;
                        swDisplay.textContent = formatSW(swTime);
                    }, 100);
                });
                stopBtn.addEventListener('click', function() {
                    if (!swRunning) return;
                    swRunning = false;
                    clearInterval(swInterval);
                });
                resetBtn.addEventListener('click', function() {
                    clearInterval(swInterval);
                    swRunning = false;
                    swTime = 0;
                    swDisplay.textContent = '00:00.0';
                });

                swRow.appendChild(startBtn);
                swRow.appendChild(stopBtn);
                swRow.appendChild(resetBtn);

                appBody.appendChild(clockDiv);
                appBody.appendChild(dateDiv);
                appBody.appendChild(document.createElement('hr'));
                const swLabel = document.createElement('div');
                swLabel.textContent = '⏱️ 秒表';
                swLabel.style.textAlign = 'center';
                swLabel.style.opacity = '0.6';
                swLabel.style.fontSize = '14px';
                appBody.appendChild(swLabel);
                appBody.appendChild(swDisplay);
                appBody.appendChild(swRow);
            },

            // ---------- 天气 ----------
            '天气': function() {
                const weathers = [
                    { icon: '☀️', temp: '28°', desc: '晴朗', days: ['今天', '周一', '周二', '周三', '周四'] },
                    { icon: '⛅', temp: '24°', desc: '多云', days: ['今天', '周一', '周二', '周三', '周四'] },
                    { icon: '🌧️', temp: '18°', desc: '小雨', days: ['今天', '周一', '周二', '周三', '周四'] },
                    { icon: '❄️', temp: '2°', desc: '小雪', days: ['今天', '周一', '周二', '周三', '周四'] },
                ];
                let wi = 0;

                const main = document.createElement('div');
                main.className = 'weather-main';
                const iconEl = document.createElement('div');
                iconEl.style.fontSize = '72px';
                const tempEl = document.createElement('div');
                tempEl.className = 'temp';
                const descEl = document.createElement('div');
                descEl.className = 'desc';

                function updateWeather(idx) {
                    const w = weathers[idx % weathers.length];
                    iconEl.textContent = w.icon;
                    tempEl.textContent = w.temp;
                    descEl.textContent = w.desc;
                }
                updateWeather(0);

                const grid = document.createElement('div');
                grid.className = 'weather-grid';

                function renderDays(idx) {
                    grid.innerHTML = '';
                    const base = weathers[idx % weathers.length];
                    for (let i = 0; i < 5; i++) {
                        const d = document.createElement('div');
                        d.className = 'day';
                        const w = weathers[(idx + i) % weathers.length];
                        d.innerHTML = `
                            <div class="day-name">${['今天','周一','周二','周三','周四'][i]}</div>
                            <div class="day-icon">${w.icon}</div>
                            <div class="day-temp">${w.temp}</div>
                        `;
                        grid.appendChild(d);
                    }
                }
                renderDays(0);

                const switchBtn = document.createElement('button');
                switchBtn.textContent = '🔄 切换天气';
                switchBtn.style.cssText =
                    'padding:12px 24px;border:none;border-radius:40px;background:#6366f1;color:#fff;font-size:16px;cursor:pointer;margin:0 auto;';
                switchBtn.addEventListener('click', function() {
                    wi++;
                    updateWeather(wi);
                    renderDays(wi);
                });

                main.appendChild(iconEl);
                main.appendChild(tempEl);
                main.appendChild(descEl);
                appBody.appendChild(main);
                appBody.appendChild(grid);
                appBody.appendChild(switchBtn);
            },

            // ---------- 图库 ----------
            '图库': function() {
                const emojis = ['🌅', '🏔️', '🌊', '🌺', '🌳', '🌄', '🌠', '🏖️', '🌋'];
                const grid = document.createElement('div');
                grid.className = 'gallery-grid';

                emojis.forEach(emoji => {
                    const photo = document.createElement('div');
                    photo.className = 'photo';
                    photo.textContent = emoji;
                    photo.addEventListener('click', function() {
                        const preview = document.getElementById('galleryPreview');
                        document.getElementById('previewEmoji').textContent = emoji;
                        preview.classList.add('active');
                    });
                    grid.appendChild(photo);
                });
                appBody.appendChild(grid);

                // 点击预览关闭
                const preview = document.getElementById('galleryPreview');
                preview.addEventListener('click', function() {
                    this.classList.remove('active');
                });
            },

            // ---------- 其他应用（简单展示） ----------
            'default': function(name) {
                const div = document.createElement('div');
                div.style.cssText =
                    'text-align:center;padding:40px 0;font-size:48px;opacity:0.3;display:flex;flex-direction:column;gap:12px;';
                div.innerHTML = `
                    <div>📱</div>
                    <div style="font-size:18px;opacity:0.5;">${name}</div>
                    <div style="font-size:14px;opacity:0.3;">荣耀风格 · 演示界面</div>
                `;
                appBody.appendChild(div);
            }
        };

        // ---- 打开应用 ----
        function openApp(name) {
            currentApp = name;
            appTitle.textContent = name;
            appBody.innerHTML = '';
            const renderer = appRenderers[name] || appRenderers['default'];
            if (renderer === appRenderers['default']) renderer(name);
            else renderer();
            container.classList.add('active');
        }

        // ---- 关闭应用 ----
        function closeApp() {
            container.classList.remove('active');
            // 清理定时器（时钟秒表）
            if (currentApp === '时钟') {
                // 无全局变量清理，但已做防泄漏
            }
            currentApp = null;
        }

        // ---- 事件绑定 ----
        document.querySelectorAll('.icon-item, .dock-item').forEach(el => {
            el.addEventListener('click', function() {
                const name = this.dataset.app;
                if (name) openApp(name);
            });
        });

        backBtn.addEventListener('click', closeApp);
        // 滑动返回（简易）
        let startX = 0;
        container.addEventListener('touchstart', e => { startX = e.touches[0].clientX; });
        container.addEventListener('touchmove', e => {
            const dx = e.touches[0].clientX - startX;
            if (dx > 80 && container.classList.contains('active')) {
                closeApp();
            }
        }, { passive: true });

        // ESC关闭
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && container.classList.contains('active')) closeApp();
        });

        // ============================================================
        //  3. 阻止滚动穿透（应用内）
        // ============================================================
        document.querySelector('.app-body')?.addEventListener('touchmove', e => {
            e.stopPropagation();
        }, { passive: false });

        console.log('✅ 荣耀·真实功能应用已加载 — 点击计算器、备忘录、时钟、天气、图库试试！');
    </script>

</body>
</html>
