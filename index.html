<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>求与影 - 节奏音游</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0b0b16; color: #fff; font-family: "Microsoft YaHei", sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #game { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
  canvas { display: block; background: radial-gradient(ellipse at center, #1a1a2e 0%, #0b0b16 100%); border-radius: 8px; box-shadow: 0 0 40px rgba(100,100,255,0.2); }
  #ui { position: absolute; top: 20px; left: 20px; font-size: 18px; line-height: 1.6; text-shadow: 0 0 10px rgba(100,200,255,0.8); pointer-events: none; }
  #startScreen, #resultScreen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); z-index: 10; }
  #resultScreen { display: none; }
  #startScreen h1 { font-size: 48px; margin-bottom: 20px; background: linear-gradient(135deg, #ff6b9d, #c44dff, #6bc5ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  #startScreen p { font-size: 16px; color: #aaa; margin-bottom: 30px; }
  #startBtn, #restartBtn { padding: 15px 50px; font-size: 22px; border: 2px solid #c44dff; background: transparent; color: #fff; border-radius: 30px; cursor: pointer; transition: all 0.3s; }
  #startBtn:hover, #restartBtn:hover { background: #c44dff; box-shadow: 0 0 30px rgba(196,77,255,0.6); }
  #resultScreen h2 { font-size: 42px; margin-bottom: 20px; color: #6bc5ff; }
  #resultScreen .stat { font-size: 20px; margin: 8px 0; }
  #restartBtn { border-color: #6bc5ff; }
  #restartBtn:hover { background: #6bc5ff; color: #000; }
  .key-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #666; }
  .touch-hint { position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #666; }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>
  <div id="ui"><div>得分: <span id="score">0</span></div><div>连击: <span id="combo">0</span></div><div id="judgeText" style="font-size:24px; color:#ffcc00; min-height:30px;"></div></div>
  <div id="startScreen"><h1>求与影</h1><p>电脑端: D F J K 按键 | 手机端: 点击对应轨道</p><p style="color:#c44dff; margin-bottom:15px;">长条音符需长按至尾部到达判定线</p><button id="startBtn">开始游戏</button></div>
  <div id="loadingScreen" style="display:none; position:absolute; inset:0; flex-direction:column; justify-content:center; align-items:center; background:rgba(0,0,0,0.9); z-index:15;"><div style="font-size:24px; color:#c44dff; margin-bottom:15px;">正在分析音频...</div><div style="width:200px; height:4px; background:#333; border-radius:2px; overflow:hidden;"><div id="loadingBar" style="width:0%; height:100%; background:linear-gradient(90deg,#c44dff,#6bc5ff); transition:width 0.3s;"></div></div><div id="loadingText" style="font-size:14px; color:#888; margin-top:10px;">准备中...</div></div>
  <div id="resultScreen"><h2>演奏结束</h2><div class="stat">最终得分: <span id="finalScore">0</span></div><div class="stat">最大连击: <span id="maxCombo">0</span></div><div class="stat">Perfect: <span id="perfectCount">0</span></div><div class="stat">Good: <span id="goodCount">0</span></div><div class="stat">Hold: <span id="holdCount">0</span></div><div class="stat">Miss: <span id="missCount">0</span></div><button id="restartBtn">再来一次</button></div>
  <div class="touch-hint">点击轨道或按下 D F J K</div>
  <div class="key-hint">按键: D F J K</div>
</div>
<script>
const MUSIC_URL = '求与影.mp3';
const HIT_SOUND_URL = '打击音效.mp3';
const LANE_COUNT = 4;
const KEYS = ['KeyD', 'KeyF', 'KeyJ', 'KeyK'];
const LANE_COLORS = ['#ff6b9d', '#c44dff', '#6bc5ff', '#4dff88'];
const NOTE_SPEED = 420;
const HIT_Y_OFFSET = 80;
const PERFECT_WINDOW = 0.06;
const GOOD_WINDOW = 0.12;
const MISS_WINDOW = 0.18;
const LONG_NOTE_CHANCE = 0.30;
const LONG_NOTE_MIN_DURATION = 0.35;
const LONG_NOTE_MAX_DURATION = 0.80;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo');
const judgeTextEl = document.getElementById('judgeText');
const startScreen = document.getElementById('startScreen');
const resultScreen = document.getElementById('resultScreen');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');

function resizeCanvas() {
  const w = Math.min(window.innerWidth, 600);
  const h = window.innerHeight;
  canvas.width = w;
  canvas.height = h;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let audioCtx, analyser, sourceNode, audioBuffer;
let hitSoundBuffer = null;
let notes = [];
let score = 0, combo = 0, maxCombo = 0;
let perfectCount = 0, goodCount = 0, holdCount = 0, missCount = 0;
let isPlaying = false;
let startTime = 0;
let judgeTimer = 0;
let particles = [];
let beatPulse = 0;
let lastTime = 0;
const laneHeld = [false, false, false, false];
const laneHoldNotes = [null, null, null, null];

async function loadAudio() {
  try {
    const response = await fetch(MUSIC_URL);
    if (!response.ok) throw new Error('Audio load failed HTTP:' + response.status);
    const arrayBuffer = await response.arrayBuffer();
    audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
    console.log('Audio loaded, duration:', audioBuffer.duration, 's');
  } catch (err) {
    console.error('Audio load failed:', err);
    alert('Audio file load failed! Please confirm "求与影.mp3" is in the same directory.\n' + err.message);
    throw err;
  }
}

async function loadHitSound() {
  try {
    const response = await fetch(HIT_SOUND_URL);
    if (!response.ok) { console.warn('Hit sound load failed HTTP:' + response.status); hitSoundBuffer = null; return; }
    const arrayBuffer = await response.arrayBuffer();
    hitSoundBuffer = await audioCtx.decodeAudioData(arrayBuffer);
    console.log('Hit sound loaded');
  } catch (err) {
    console.warn('Hit sound load failed:', err);
    hitSoundBuffer = null;
  }
}

function playHitSound() {
  if (!hitSoundBuffer) return;
  try {
    const source = audioCtx.createBufferSource();
    source.buffer = hitSoundBuffer;
    source.connect(audioCtx.destination);
    source.start(0);
  } catch(e) { console.warn('Play hit sound failed:', e); }
}

async function generateNotes() {
  const sampleRate = audioBuffer.sampleRate;
  const channelData = audioBuffer.getChannelData(0);
  const len = channelData.length;
  const windowSize = Math.floor(sampleRate * 0.03);
  const hopSize = Math.floor(sampleRate * 0.05);
  const cumSum = new Float32Array(len + 1);
  for (let i = 0; i < len; i++) {
    cumSum[i + 1] = cumSum[i] + channelData[i] * channelData[i];
  }
  const maxI = len - windowSize;
  const totalSteps = Math.ceil(maxI / hopSize);
  const chunkSize = 500;
  let prevEnergy = 0;
  let lastNoteTime = 0;
  const minInterval = 0.12;
  let processed = 0;

  function processChunk() {
    const end = Math.min(processed + chunkSize, totalSteps);
    for (let step = processed; step < end; step++) {
      const i = step * hopSize;
      if (i + windowSize > len) break;
      const energy = Math.sqrt((cumSum[i + windowSize] - cumSum[i]) / windowSize);
      const currentTime = i / sampleRate;
      const energyDiff = energy - prevEnergy;
      if (energyDiff > 0.02 && energy > 0.05 && (currentTime - lastNoteTime) > minInterval) {
        const isLong = Math.random() < LONG_NOTE_CHANCE;
        const duration = isLong ? LONG_NOTE_MIN_DURATION + Math.random() * (LONG_NOTE_MAX_DURATION - LONG_NOTE_MIN_DURATION) : 0;
        notes.push({
          lane: Math.floor(Math.random() * LANE_COUNT),
          time: currentTime, duration: duration,
          y: -20, tailY: -20,
          hit: false, tailHit: false, missed: false,
          isLong: isLong, holdProgress: 0, held: false, faded: false
        });
        lastNoteTime = currentTime;
      }
      prevEnergy = energy * 0.7 + prevEnergy * 0.3;
    }
    processed = end;
    const pct = Math.floor(processed / totalSteps * 100);
    document.getElementById('loadingBar').style.width = pct + '%';
    document.getElementById('loadingText').textContent = 'Analyzing... ' + pct + '%';
    if (processed < totalSteps) {
      setTimeout(processChunk, 0);
    } else {
      // 去重：同一位置不允许单点和长条重叠
      notes.sort((a, b) => a.time - b.time);
      const deduped = [];
      const minTimeGap = 0.06;
      for (const note of notes) {
        let keep = true;
        for (const existing of deduped) {
          if (Math.abs(existing.time - note.time) < minTimeGap && existing.lane === note.lane) {
            if (existing.isLong || note.isLong) {
              keep = false;
            } else if (existing.time < note.time) {
              keep = false;
            }
            break;
          }
        }
        if (keep) deduped.push(note);
      }
      notes = deduped;
      console.log('Notes: ' + notes.length + ' total, ' + notes.filter(n=>n.isLong).length + ' long');
      document.getElementById('loadingScreen').style.display = 'none';
      runGame();
    }
  }
  processChunk();
}

async function startGame() {
  console.log('Game start');
  startScreen.style.display = 'none';
  resultScreen.style.display = 'none';
  score = 0; combo = 0; maxCombo = 0;
  perfectCount = 0; goodCount = 0; holdCount = 0; missCount = 0;
  notes = []; particles = []; lastTime = 0;
  laneHeld.fill(false); laneHoldNotes.fill(null);
  updateUI();
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  if (!audioBuffer) await loadAudio();
  if (!hitSoundBuffer) await loadHitSound();
  document.getElementById('loadingScreen').style.display = 'flex';
  document.getElementById('loadingBar').style.width = '0%';
  document.getElementById('loadingText').textContent = 'Preparing...';
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  sourceNode = audioCtx.createBufferSource();
  sourceNode.buffer = audioBuffer;
  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);
  sourceNode.start();
  startTime = audioCtx.currentTime;
  isPlaying = true;
  sourceNode.onended = () => { setTimeout(() => { if (isPlaying) endGame(); }, 2000); };
  generateNotes();
}

function endGame() {
  isPlaying = false;
  if (sourceNode) { try { sourceNode.stop(); } catch(e) {} }
  document.getElementById('finalScore').textContent = Math.floor(score);
  document.getElementById('maxCombo').textContent = maxCombo;
  document.getElementById('perfectCount').textContent = perfectCount;
  document.getElementById('goodCount').textContent = goodCount;
  document.getElementById('holdCount').textContent = holdCount;
  document.getElementById('missCount').textContent = missCount;
  resultScreen.style.display = 'flex';
  document.getElementById('loadingScreen').style.display = 'none';
}

function tryHit(lane) {
  if (!isPlaying) return;
  const currentTime = audioCtx.currentTime - startTime;
  let closestNote = null;
  let closestDist = Infinity;
  const heldNote = laneHoldNotes[lane];
  if (heldNote && !heldNote.tailHit && !heldNote.faded) return;
  for (const note of notes) {
    if (note.hit || note.missed || note.lane !== lane) continue;
    if (note.tailHit) continue;
    const dist = Math.abs(note.time - currentTime);
    if (dist < closestDist) { closestDist = dist; closestNote = note; }
  }
  if (!closestNote) return;
  if (closestDist <= PERFECT_WINDOW) {
    closestNote.hit = true;
    score += 300 * (1 + combo * 0.1);
    combo++; perfectCount++;
    showJudge('Perfect!', '#ffcc00');
    spawnParticles(lane, '#ffcc00');
    playHitSound();
    if (closestNote.faded) { closestNote.faded = false; }
    if (closestNote.isLong) {
      closestNote.held = true; closestNote.holdProgress = 0; closestNote.faded = false;
      laneHeld[lane] = true; laneHoldNotes[lane] = closestNote;
    }
  } else if (closestDist <= GOOD_WINDOW) {
    closestNote.hit = true;
    score += 150 * (1 + combo * 0.05);
    combo++; goodCount++;
    showJudge('Good', '#6bc5ff');
    spawnParticles(lane, '#6bc5ff');
    playHitSound();
    if (closestNote.faded) { closestNote.faded = false; }
    if (closestNote.isLong) {
      closestNote.held = true; closestNote.holdProgress = 0; closestNote.faded = false;
      laneHeld[lane] = true; laneHoldNotes[lane] = closestNote;
    }
  } else if (closestDist <= MISS_WINDOW) {
    combo = 0; missCount++;
    showJudge('Miss', '#ff4444');
  }
  if (combo > maxCombo) maxCombo = combo;
  updateUI();
}

function releaseLane(lane) {
  laneHeld[lane] = false;
  const heldNote = laneHoldNotes[lane];
  if (heldNote) {
    const currentTime = audioCtx.currentTime - startTime;
    const tailTime = heldNote.time + heldNote.duration;
    if (currentTime < tailTime - GOOD_WINDOW) {
      heldNote.faded = true;
      heldNote.held = false;
      laneHoldNotes[lane] = heldNote;
    } else {
      heldNote.tailHit = true;
      heldNote.faded = false;
      score += 200 * (1 + combo * 0.08);
      combo++; holdCount++;
      showJudge('Hold!', '#4dff88');
      spawnParticles(lane, '#4dff88');
      playHitSound();
      if (combo > maxCombo) maxCombo = combo;
      laneHoldNotes[lane] = null;
    }
    updateUI();
  }
}

function showJudge(text, color) {
  judgeTextEl.textContent = text;
  judgeTextEl.style.color = color;
  judgeTimer = 0.6;
}

function updateUI() {
  scoreEl.textContent = Math.floor(score);
  comboEl.textContent = combo;
}

function spawnParticles(lane, color) {
  const laneWidth = canvas.width / LANE_COUNT;
  const x = lane * laneWidth + laneWidth / 2;
  const y = canvas.height - HIT_Y_OFFSET;
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 / 12) * i + Math.random() * 0.3;
    const speed = 100 + Math.random() * 150;
    particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 100,
      life: 0.6, maxLife: 0.6, color: color, size: 3 + Math.random() * 3
    });
  }
}

function runGame() { lastTime = 0; requestAnimationFrame(gameLoop); }

function gameLoop(timestamp) {
  if (!isPlaying) return;
  const dt = lastTime ? (timestamp - lastTime) / 1000 : 0.016;
  lastTime = timestamp;
  const currentTime = audioCtx.currentTime - startTime;

  let freqData = null;
  if (analyser) {
    freqData = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(freqData);
    let bass = 0;
    for (let i = 0; i < 8; i++) bass += freqData[i];
    beatPulse = bass / (8 * 255);
  }

  const hitY = canvas.height - HIT_Y_OFFSET;

  for (const note of notes) {
    if (note.missed) continue;
    if (note.hit && (!note.isLong || note.tailHit)) continue;
    const timeDiff = note.time - currentTime;
    note.y = hitY - timeDiff * NOTE_SPEED;

    if (note.isLong) {
      const tailTimeDiff = (note.time + note.duration) - currentTime;
      note.tailY = hitY - tailTimeDiff * NOTE_SPEED;

      if (note.held && !note.tailHit) {
        const tailTime = note.time + note.duration;
        const progress = Math.min(1, (currentTime - note.time) / note.duration);
        note.holdProgress = progress;

        if (currentTime >= tailTime - GOOD_WINDOW && currentTime <= tailTime + MISS_WINDOW) {
          if (!note.tailHit) {
            note.tailHit = true;
            score += 200 * (1 + combo * 0.08);
            combo++; holdCount++;
            showJudge('Hold!', '#4dff88');
            spawnParticles(note.lane, '#4dff88');
            playHitSound();
            if (combo > maxCombo) maxCombo = combo;
            updateUI();
          }
        }

        if (currentTime > tailTime + MISS_WINDOW && !note.tailHit) {
          note.tailHit = true; note.held = false;
          laneHeld[note.lane] = false; laneHoldNotes[note.lane] = null;
          if (note.holdProgress < 1) {
            combo = 0; missCount++;
            showJudge('Miss', '#ff4444'); updateUI();
          }
        }
      }
    }

    if (!note.isLong && timeDiff < -MISS_WINDOW && !note.hit && !note.missed) {
      note.missed = true; combo = 0; missCount++;
      showJudge('Miss', '#ff4444'); updateUI();
    }
    if (note.isLong && !note.hit && timeDiff < -MISS_WINDOW && !note.missed) {
      note.missed = true; combo = 0; missCount++;
      showJudge('Miss', '#ff4444'); updateUI();
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (judgeTimer > 0) {
    judgeTimer -= dt;
    if (judgeTimer <= 0) judgeTextEl.textContent = '';
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (beatPulse > 0.3) {
    ctx.fillStyle = 'rgba(100, 50, 200, ' + (beatPulse * 0.15) + ')';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  if (freqData) {
    const barWidth = canvas.width / freqData.length;
    ctx.globalAlpha = 0.15;
    for (let i = 0; i < freqData.length; i++) {
      const barHeight = (freqData[i] / 255) * canvas.height * 0.4;
      const hue = (i / freqData.length) * 360;
      ctx.fillStyle = 'hsl(' + hue + ', 80%, 60%)';
      ctx.fillRect(i * barWidth, canvas.height - barHeight, barWidth - 1, barHeight);
    }
    ctx.globalAlpha = 1;
  }

  const laneWidth = canvas.width / LANE_COUNT;
  for (let i = 0; i < LANE_COUNT; i++) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.fillRect(i * laneWidth, 0, laneWidth, canvas.height);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.beginPath();
    ctx.moveTo(i * laneWidth, 0);
    ctx.lineTo(i * laneWidth, canvas.height);
    ctx.stroke();
  }

  ctx.save();
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 10 + beatPulse * 20;
  ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.8 + beatPulse * 0.2) + ')';
  ctx.lineWidth = 3 + beatPulse * 4;
  ctx.beginPath();
  ctx.moveTo(0, hitY);
  ctx.lineTo(canvas.width, hitY);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 1;
  ctx.restore();

  // 判定线：纯直线，无圆圈（轨道指示用轨道底色微光）
  for (let i = 0; i < LANE_COUNT; i++) {
    const x = i * laneWidth + laneWidth / 2;
    const isHeld = laneHeld[i];
    // 仅在按住时，在判定线位置画一个低透明度的轨道色光带
    if (isHeld) {
      ctx.globalAlpha = 0.15;
      ctx.fillStyle = LANE_COLORS[i];
      ctx.fillRect(i * laneWidth, hitY - 3, laneWidth, 6);
      ctx.globalAlpha = 1;
    }
  }

  for (const note of notes) {
    if (note.missed) continue;
    if (note.hit && (!note.isLong || note.tailHit)) continue;
    if (note.y < -80 || note.y > canvas.height + 80) continue;
    if (note.isLong && note.tailY < -100 && note.y < -80) continue;

    const x = note.lane * laneWidth + laneWidth / 2;
    const color = LANE_COLORS[note.lane];

    if (note.isLong) {
      const topY = Math.min(note.y, note.tailY);
      const bottomY = Math.max(note.y, note.tailY);

      let alpha = 1;
      if (note.faded) {
        alpha = 0.25;
      } else if (note.held) {
        alpha = 0.7;
      } else {
        alpha = 0.55;
      }

      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.fillRect(x - 28, topY, 56, bottomY - topY);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = alpha * 0.8;
      ctx.strokeRect(x - 18, topY, 36, bottomY - topY);

      ctx.globalAlpha = note.faded ? 0.25 : (note.hit ? 0.3 : 1);
      ctx.beginPath();
      ctx.arc(x, note.y, 28, 0, Math.PI * 2);
      ctx.fillStyle = note.hit ? '#888' : color;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.globalAlpha = note.faded ? 0.25 : (note.tailHit ? 0.3 : 1);
      ctx.beginPath();
      ctx.arc(x, note.tailY, 28, 0, Math.PI * 2);
      ctx.fillStyle = note.tailHit ? '#888' : color;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();

      if (note.held && !note.tailHit && note.holdProgress > 0 && !note.faded) {
        ctx.globalAlpha = 0.5;
        const barHeight = bottomY - topY;
        const fillHeight = barHeight * note.holdProgress;
        ctx.fillStyle = '#fff';
        ctx.fillRect(x - 24, bottomY - fillHeight, 48, fillHeight);
      }
      ctx.globalAlpha = 1;
    } else {
      if (note.y < -30 || note.y > canvas.height + 30) continue;
      const gradient = ctx.createRadialGradient(x, note.y, 0, x, note.y, 24);
      gradient.addColorStop(0, color);
      gradient.addColorStop(1, 'transparent');
      ctx.fillStyle = gradient;
      ctx.fillRect(x - 34, note.y - 34, 68, 68);
      ctx.beginPath();
      ctx.arc(x, note.y, 28, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.lineWidth = 1;
    }
  }

  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(gameLoop);
}

window.addEventListener('keydown', (e) => {
  if (!isPlaying) return;
  const lane = KEYS.indexOf(e.code);
  if (lane !== -1 && !laneHeld[lane]) {
    laneHeld[lane] = true;
    tryHit(lane);
  }
});

window.addEventListener('keyup', (e) => {
  if (!isPlaying) return;
  const lane = KEYS.indexOf(e.code);
  if (lane !== -1) {
    laneHeld[lane] = false;
    releaseLane(lane);
  }
});

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (!isPlaying) return;
  for (let touch of e.changedTouches) {
    const rect = canvas.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const lane = Math.floor(x / (rect.width / LANE_COUNT));
    if (lane >= 0 && lane < LANE_COUNT) {
      laneHeld[lane] = true;
      tryHit(lane);
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
  e.preventDefault();
  if (!isPlaying) return;
  for (let touch of e.changedTouches) {
    const rect = canvas.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const lane = Math.floor(x / (rect.width / LANE_COUNT));
    if (lane >= 0 && lane < LANE_COUNT) {
      laneHeld[lane] = false;
      releaseLane(lane);
    }
  }
}, { passive: false });

canvas.addEventListener('touchcancel', function(e) {
  if (!isPlaying) return;
  for (let touch of e.changedTouches) {
    const rect = canvas.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const lane = Math.floor(x / (rect.width / LANE_COUNT));
    if (lane >= 0 && lane < LANE_COUNT) {
      laneHeld[lane] = false;
      releaseLane(lane);
    }
  }
});

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);
</script>
