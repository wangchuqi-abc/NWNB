<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Windows 11 动态模拟</title>
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .win11 {
            width: 100vw;
            height: 100vh;
            max-width: 1400px;
            max-height: 900px;
            aspect-ratio: 16 / 9;
            background: #1a1a2e;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
        }
        @media (max-width: 800px) {
            .win11 {
                border-radius: 0;
                max-width: 100%;
                max-height: 100%;
            }
        }

        /* ===== 动态壁纸 ===== */
        .wallpaper {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            animation: wallpaperFlow 14s ease-in-out infinite alternate;
            will-change: background;
        }
        @keyframes wallpaperFlow {
            0% {
                background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            }
            25% {
                background: linear-gradient(135deg, #1a1a3e, #4a3f7a, #2a2a4e);
            }
            50% {
                background: linear-gradient(135deg, #1a0f2e, #4a2a6a, #2a1a3e);
            }
            75% {
                background: linear-gradient(135deg, #0f1a2e, #2a4a6a, #1a2a4e);
            }
            100% {
                background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            }
        }
        .wallpaper-glow {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 40%, rgba(99, 102, 241, 0.15), transparent 60%),
                radial-gradient(ellipse at 70% 70%, rgba(168, 85, 247, 0.10), transparent 50%);
            animation: glowPulse 8s ease-in-out infinite alternate;
            will-change: transform, opacity;
        }
        @keyframes glowPulse {
            0% {
                opacity: 0.5;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            100% {
                opacity: 0.6;
                transform: scale(0.95);
            }
        }

        /* ===== 桌面 ===== */
        .desktop {
            flex: 1;
            position: relative;
            z-index: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 8px;
            overflow: hidden;
            touch-action: none;
        }
        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 72px;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
            -webkit-touch-callout: none;
        }
        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .desktop-icon:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.12);
        }
        .desktop-icon .icon {
            font-size: 36px;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
        }
        .desktop-icon .label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
            text-align: center;
            line-height: 1.2;
            max-width: 68px;
            word-break: break-all;
        }

        /* ===== 任务栏 ===== */
        .taskbar {
            height: 48px;
            background: rgba(30, 30, 50, 0.80);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 4px;
            z-index: 100;
            flex-shrink: 0;
            position: relative;
        }
        .taskbar .start-btn {
            width: 44px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            touch-action: manipulation;
        }
        .taskbar .start-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .taskbar .start-btn:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.92);
        }
        .taskbar .task-items {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 2px;
            height: 100%;
            padding: 0 6px;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
        }
        .taskbar .task-items::-webkit-scrollbar {
            height: 0;
        }
        .taskbar .task-item {
            height: 36px;
            padding: 0 14px;
            border-radius: 6px;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
            white-space: nowrap;
            border: none;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .taskbar .task-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .taskbar .task-item:active {
            transform: scale(0.95);
        }
        .taskbar .task-item.active {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .taskbar .task-item .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4fc3f7;
            display: none;
            animation: dotPulse 1.2s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
        .taskbar .task-item.active .dot {
            display: block;
        }
        .taskbar .tray {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            padding-left: 10px;
            border-left: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        .taskbar .tray .tray-icon {
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: background 0.15s;
            touch-action: manipulation;
        }
        .taskbar .tray .tray-icon:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .taskbar .tray .clock {
            font-size: 12px;
            font-weight: 400;
            padding: 0 4px;
            min-width: 60px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* ===== 开始菜单 ===== */
        .start-menu {
            position: absolute;
            bottom: 52px;
            left: 6px;
            width: 380px;
            max-height: 460px;
            background: rgba(30, 30, 50, 0.92);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            padding: 16px;
            z-index: 200;
            display: none;
            overflow-y: auto;
            animation: menuOpen 0.2s ease-out;
        }
        @keyframes menuOpen {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .start-menu.open {
            display: block;
        }
        .start-menu::-webkit-scrollbar {
            width: 4px;
        }
        .start-menu::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
        }
        .start-menu .search-box {
            width: 100%;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
            transition: border-color 0.2s, background 0.2s;
        }
        .start-menu .search-box:focus {
            border-color: rgba(99, 102, 241, 0.3);
            background: rgba(255, 255, 255, 0.06);
        }
        .start-menu .search-box::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }
        .start-menu .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        .start-menu .app-grid .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
        }
        .start-menu .app-grid .app:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .start-menu .app-grid .app:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.10);
        }
        .start-menu .app-grid .app .app-icon {
            font-size: 28px;
        }
        .start-menu .app-grid .app .app-name {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.65);
            text-align: center;
            line-height: 1.2;
        }

        /* ===== 窗口 ===== */
        .window {
            position: absolute;
            background: rgba(28, 28, 48, 0.92);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            min-width: 280px;
            min-height: 160px;
            z-index: 50;
            pointer-events: auto;
            transition: box-shadow 0.25s, border-color 0.25s;
            touch-action: none;
        }
        .window.open {
            display: flex;
        }
        .window.focus {
            box-shadow: 0 15px 60px rgba(0, 0, 0, 0.7);
            border-color: rgba(255, 255, 255, 0.10);
        }
        .window.maximized {
            border-radius: 0;
            inset: 0 !important;
            max-width: 100% !important;
            max-height: 100% !important;
        }
        .window .title-bar {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px 10px 0 0;
            cursor: grab;
            flex-shrink: 0;
            min-height: 40px;
            touch-action: none;
        }
        .window .title-bar:active {
            cursor: grabbing;
        }
        .window.maximized .title-bar {
            border-radius: 0;
        }
        .window .title-bar .title-text {
            flex: 1;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: default;
            padding: 0 4px;
        }
        .window .title-bar .title-text .win-icon {
            font-size: 16px;
        }
        .window .title-bar .win-controls {
            display: flex;
            gap: 4px;
        }
        .window .title-bar .win-controls button {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s, transform 0.1s;
            touch-action: manipulation;
        }
        .window .title-bar .win-controls button:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .window .title-bar .win-controls button:active {
            transform: scale(0.88);
        }
        .window .title-bar .win-controls .close:hover {
            background: #e81123;
            color: #fff;
        }
        .window .title-bar .win-controls .maximize:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .window .title-bar .win-controls .minimize:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .window .window-body {
            flex: 1;
            padding: 14px 16px;
            overflow: auto;
            color: rgba(255, 255, 255, 0.75);
            font-size: 13px;
            line-height: 1.6;
        }
        .window .window-body::-webkit-scrollbar {
            width: 6px;
        }
        .window .window-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }

        /* ===== 资源管理器 ===== */
        .explorer-body {
            display: flex;
            gap: 12px;
            height: 100%;
        }
        .explorer-sidebar {
            width: 130px;
            flex-shrink: 0;
        }
        .explorer-sidebar .folder-item {
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
            touch-action: manipulation;
        }
        .explorer-sidebar .folder-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .explorer-sidebar .folder-item:active {
            background: rgba(255, 255, 255, 0.08);
        }
        .explorer-sidebar .folder-item.active {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .explorer-content {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
            gap: 6px;
            align-content: flex-start;
        }
        .explorer-content .file-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 10px 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
        }
        .explorer-content .file-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .explorer-content .file-item:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.08);
        }
        .explorer-content .file-item .file-icon {
            font-size: 30px;
        }
        .explorer-content .file-item .file-name {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            line-height: 1.2;
            max-width: 64px;
            word-break: break-all;
        }

        /* ===== 任务管理器 ===== */
        .taskmgr-body {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .taskmgr-body .task-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
            font-size: 12px;
            transition: background 0.15s;
        }
        .taskmgr-body .task-row:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .taskmgr-body .task-row .task-name {
            color: rgba(255, 255, 255, 0.6);
        }
        .taskmgr-body .task-row .task-cpu {
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .taskmgr-body .task-row .task-cpu .bar {
            display: inline-block;
            width: 60px;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .taskmgr-body .task-row .task-cpu .bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5, #818cf8);
            border-radius: 4px;
            transition: width 0.8s ease;
        }

        /* ===== 右键菜单 ===== */
        .context-menu {
            position: absolute;
            background: rgba(30, 30, 50, 0.92);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            padding: 4px;
            z-index: 300;
            display: none;
            min-width: 170px;
            animation: menuOpen 0.12s ease-out;
        }
        .context-menu .ctx-item {
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            transition: background 0.1s;
            display: flex;
            align-items: center;
            gap: 10px;
            touch-action: manipulation;
        }
        .context-menu .ctx-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .context-menu .ctx-item:active {
            background: rgba(255, 255, 255, 0.10);
        }
        .context-menu .ctx-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.04);
            margin: 4px 8px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 800px) {
            .win11 {
                border-radius: 0;
                max-width: 100%;
                max-height: 100%;
            }
            .start-menu {
                width: 90%;
                left: 5%;
                max-height: 60vh;
            }
            .window {
                min-width: 240px;
                min-height: 140px;
            }
            .explorer-sidebar {
                width: 80px;
            }
            .explorer-content {
                grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            }
            .desktop-icon {
                width: 64px;
                padding: 6px 8px;
            }
            .desktop-icon .icon {
                font-size: 30px;
            }
            .desktop-icon .label {
                font-size: 10px;
            }
        }
        @media (max-width: 480px) {
            .taskbar .task-item {
                padding: 0 8px;
                font-size: 11px;
            }
            .taskbar .tray .clock {
                font-size: 10px;
                min-width: 50px;
            }
            .window .title-bar .title-text {
                font-size: 12px;
            }
            .window .title-bar .win-controls button {
                width: 24px;
                height: 24px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="win11" id="win11">

        <!-- ===== 动态壁纸 ===== -->
        <div class="wallpaper"></div>
        <div class="wallpaper-glow"></div>

        <!-- ===== 桌面 ===== -->
        <div class="desktop" id="desktop">
            <div class="desktop-icon" data-app="此电脑"><div class="icon">💻</div><div class="label">此电脑</div></div>
            <div class="desktop-icon" data-app="回收站"><div class="icon">🗑️</div><div class="label">回收站</div></div>
            <div class="desktop-icon" data-app="文档"><div class="icon">📁</div><div class="label">文档</div></div>
            <div class="desktop-icon" data-app="下载"><div class="icon">📥</div><div class="label">下载</div></div>
            <div class="desktop-icon" data-app="任务管理器"><div class="icon">⚡</div><div class="label">任务管理器</div></div>
            <div class="desktop-icon" data-app="记事本"><div class="icon">📝</div><div class="label">记事本</div></div>
            <div class="desktop-icon" data-app="设置"><div class="icon">⚙️</div><div class="label">设置</div></div>
            <div class="desktop-icon" data-app="终端"><div class="icon">⌨️</div><div class="label">终端</div></div>
        </div>

        <!-- ===== 任务栏 ===== -->
        <div class="taskbar" id="taskbar">
            <button class="start-btn" id="startBtn">⊞</button>
            <div class="task-items" id="taskItems"></div>
            <div class="tray">
                <span class="tray-icon">🔊</span>
                <span class="tray-icon">📶</span>
                <span class="tray-icon">🔋</span>
                <span class="clock" id="clock">12:00:00</span>
            </div>
        </div>

        <!-- ===== 开始菜单 ===== -->
        <div class="start-menu" id="startMenu">
            <input class="search-box" placeholder="搜索应用..." id="searchBox" />
            <div class="app-grid" id="appGrid">
                <div class="app" data-app="此电脑"><div class="app-icon">💻</div><div class="app-name">此电脑</div></div>
                <div class="app" data-app="回收站"><div class="app-icon">🗑️</div><div class="app-name">回收站</div></div>
                <div class="app" data-app="文档"><div class="app-icon">📁</div><div class="app-name">文档</div></div>
                <div class="app" data-app="下载"><div class="app-icon">📥</div><div class="app-name">下载</div></div>
                <div class="app" data-app="任务管理器"><div class="app-icon">⚡</div><div class="app-name">任务管理器</div></div>
                <div class="app" data-app="记事本"><div class="app-icon">📝</div><div class="app-name">记事本</div></div>
                <div class="app" data-app="设置"><div class="app-icon">⚙️</div><div class="app-name">设置</div></div>
                <div class="app" data-app="终端"><div class="app-icon">⌨️</div><div class="app-name">终端</div></div>
            </div>
        </div>

        <!-- ===== 窗口容器 ===== -->
        <div id="windowsContainer" style="position:absolute;inset:0;z-index:50;pointer-events:none;"></div>

        <!-- ===== 右键菜单 ===== -->
        <div class="context-menu" id="contextMenu">
            <div class="ctx-item" data-action="refresh"><span>🔄</span> 刷新</div>
            <div class="ctx-item" data-action="newfolder"><span>📁</span> 新建文件夹</div>
            <div class="ctx-item" data-action="newtxt"><span>📄</span> 新建文本文档</div>
            <div class="ctx-divider"></div>
            <div class="ctx-item" data-action="taskmgr"><span>⚡</span> 任务管理器</div>
        </div>

    </div>

    <script>
        // ================================================================
        //  1. 动态时钟（秒级跳动）
        // ================================================================
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0') + ':' +
                String(now.getSeconds()).padStart(2, '0');
        }
        updateClock();
        setInterval(updateClock, 500);

        // ================================================================
        //  2. 窗口系统
        // ================================================================
        const winContainer = document.getElementById('windowsContainer');
        let windowZIndex = 50;
        let windowCounter = 0;
        let activeWindowId = null;
        let windowData = {};

        const appConfigs = {
            '此电脑': { icon: '💻', title: '此电脑', content: 'explorer' },
            '回收站': { icon: '🗑️', title: '回收站', content: 'recycle' },
            '文档': { icon: '📁', title: '文档', content: 'explorer' },
            '下载': { icon: '📥', title: '下载', content: 'explorer' },
            '任务管理器': { icon: '⚡', title: '任务管理器', content: 'taskmgr' },
            '记事本': { icon: '📝', title: '记事本', content: 'notepad' },
            '设置': { icon: '⚙️', title: '设置', content: 'settings' },
            '终端': { icon: '⌨️', title: '终端', content: 'terminal' },
        };

        function renderWindowContent(appName, bodyEl) {
            const config = appConfigs[appName];
            if (!config) { bodyEl.textContent = '未知应用'; return; }

            switch (config.content) {
                case 'explorer': {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'explorer-body';
                    const sidebar = document.createElement('div');
                    sidebar.className = 'explorer-sidebar';
                    ['桌面', '下载', '文档', '图片', '音乐', '视频'].forEach(f => {
                        const item = document.createElement('div');
                        item.className = 'folder-item' + (f === '文档' ? ' active' : '');
                        item.textContent = '📁 ' + f;
                        sidebar.appendChild(item);
                    });
                    const content = document.createElement('div');
                    content.className = 'explorer-content';
                    [
                        { name: '项目报告.docx', icon: '📄' },
                        { name: '照片集', icon: '🖼️' },
                        { name: '音乐', icon: '🎵' },
                        { name: '工作笔记.txt', icon: '📝' },
                        { name: '预算表.xlsx', icon: '📊' },
                        { name: '演示文稿.pptx', icon: '📽️' },
                    ].forEach(f => {
                        const item = document.createElement('div');
                        item.className = 'file-item';
                        item.innerHTML =
                            `<div class="file-icon">${f.icon}</div><div class="file-name">${f.name}</div>`;
                        content.appendChild(item);
                    });
                    wrapper.appendChild(sidebar);
                    wrapper.appendChild(content);
                    bodyEl.appendChild(wrapper);
                    break;
                }
                case 'recycle': {
                    const div = document.createElement('div');
                    div.style.cssText =
                        'text-align:center;padding:30px 0;color:rgba(255,255,255,0.3);font-size:14px;';
                    div.innerHTML = '🗑️ 回收站为空<br><span style="font-size:12px;opacity:0.4;">所有已删除的文件将出现在这里</span>';
                    bodyEl.appendChild(div);
                    break;
                }
                case 'taskmgr': {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'taskmgr-body';
                    const tasks = [
                        { name: 'Windows 资源管理器', cpu: 12 },
                        { name: '桌面窗口管理器', cpu: 8 },
                        { name: 'Chrome (20 个标签页)', cpu: 45 },
                        { name: 'Code.exe', cpu: 22 },
                        { name: '系统空闲进程', cpu: 3 },
                        { name: 'Windows 11 模拟器', cpu: 18 },
                    ];
                    tasks.forEach(t => {
                        const row = document.createElement('div');
                        row.className = 'task-row';
                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'task-name';
                        nameSpan.textContent = t.name;
                        const cpuSpan = document.createElement('span');
                        cpuSpan.className = 'task-cpu';
                        const bar = document.createElement('span');
                        bar.className = 'bar';
                        const fill = document.createElement('span');
                        fill.className = 'fill';
                        fill.style.width = t.cpu + '%';
                        bar.appendChild(fill);
                        cpuSpan.textContent = t.cpu + '% ';
                        cpuSpan.appendChild(bar);
                        row.appendChild(nameSpan);
                        row.appendChild(cpuSpan);
                        wrapper.appendChild(row);
                    });
                    bodyEl.appendChild(wrapper);
                    break;
                }
                case 'notepad': {
                    const ta = document.createElement('textarea');
                    ta.style.cssText =
                        'width:100%;height:100%;min-height:160px;background:transparent;border:none;color:rgba(255,255,255,0.75);font-size:14px;font-family:monospace;resize:none;outline:none;padding:4px;';
                    ta.placeholder = '在此输入文字...';
                    ta.value = '这是记事本\n\n你可以在这里输入文字。\n\n窗口可以拖动、最大化、最小化、关闭。';
                    bodyEl.appendChild(ta);
                    break;
                }
                case 'settings': {
                    const div = document.createElement('div');
                    div.style.cssText = 'display:flex;flex-direction:column;gap:8px;padding:4px 0;';
                    [
                        { icon: '🖥️', label: '显示' },
                        { icon: '🔊', label: '声音' },
                        { icon: '📶', label: '网络' },
                        { icon: '🔋', label: '电源' },
                        { icon: '🔒', label: '隐私' },
                        { icon: '🔄', label: '更新' },
                    ].forEach(item => {
                        const row = document.createElement('div');
                        row.style.cssText =
                            'display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.02);cursor:pointer;transition:background 0.15s;touch-action:manipulation;';
                        row.innerHTML =
                            `<span style="font-size:18px;">${item.icon}</span><span>${item.label}</span>`;
                        row.addEventListener('mouseenter', () => { row.style.background =
                            'rgba(255,255,255,0.04)'; });
                        row.addEventListener('mouseleave', () => { row.style.background =
                            'rgba(255,255,255,0.02)'; });
                        div.appendChild(row);
                    });
                    bodyEl.appendChild(div);
                    break;
                }
                case 'terminal': {
                    const div = document.createElement('div');
                    div.style.cssText =
                        'font-family:monospace;font-size:13px;background:rgba(0,0,0,0.2);border-radius:8px;padding:12px;min-height:120px;white-space:pre-wrap;color:rgba(255,255,255,0.7);';
                    div.textContent =
                        'Microsoft Windows [版本 11.0.22621]\n(c) Microsoft Corporation。保留所有权利。\n\nC:\\Users\\User> echo Hello Windows 11!\nHello Windows 11!\n\nC:\\Users\\User> _';
                    bodyEl.appendChild(div);
                    break;
                }
                default: { bodyEl.textContent = '应用内容加载中...'; }
            }
        }

        function createWindow(appName) {
            const config = appConfigs[appName];
            if (!config) return;

            for (const wid in windowData) {
                if (windowData[wid].app === appName) {
                    focusWindow(wid);
                    return;
                }
            }

            const winId = 'win_' + (++windowCounter);
            const win = document.createElement('div');
            win.className = 'window open';
            win.id = winId;
            win.style.width = Math.min(580, window.innerWidth * 0.7) + 'px';
            win.style.height = Math.min(380, window.innerHeight * 0.6) + 'px';
            win.style.left = (40 + (windowCounter % 6) * 28) + 'px';
            win.style.top = (30 + (windowCounter % 5) * 26) + 'px';
            win.style.pointerEvents = 'auto';

            const titleBar = document.createElement('div');
            titleBar.className = 'title-bar';
            titleBar.innerHTML = `
                <div class="title-text"><span class="win-icon">${config.icon}</span> ${config.title}</div>
                <div class="win-controls">
                    <button class="minimize" data-action="minimize">─</button>
                    <button class="maximize" data-action="maximize">☐</button>
                    <button class="close" data-action="close">✕</button>
                </div>
            `;
            win.appendChild(titleBar);

            const body = document.createElement('div');
            body.className = 'window-body';
            win.appendChild(body);
            renderWindowContent(appName, body);

            winContainer.appendChild(win);

            windowData[winId] = {
                app: appName,
                element: win,
                isMaximized: false,
                prevRect: null,
                minimized: false,
            };

            // 控制按钮
            titleBar.querySelector('.close').addEventListener('click', (e) => {
                e.stopPropagation();
                closeWindow(winId);
            });
            titleBar.querySelector('.minimize').addEventListener('click', (e) => {
                e.stopPropagation();
                minimizeWindow(winId);
            });
            titleBar.querySelector('.maximize').addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMaximize(winId);
            });

            win.addEventListener('mousedown', () => focusWindow(winId));

            // ---- 鼠标拖拽 ----
            let isDragging = false,
                dragStartX, dragStartY, dragStartLeft, dragStartTop;
            titleBar.addEventListener('mousedown', (e) => {
                if (windowData[winId].isMaximized || e.target.closest('.win-controls')) return;
                isDragging = true;
                const rect = win.getBoundingClientRect();
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                dragStartLeft = parseInt(win.style.left) || 0;
                dragStartTop = parseInt(win.style.top) || 0;
                win.style.cursor = 'grabbing';
                e.preventDefault();
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - dragStartX,
                    dy = e.clientY - dragStartY;
                win.style.left = (dragStartLeft + dx) + 'px';
                win.style.top = (dragStartTop + dy) + 'px';
            });
            document.addEventListener('mouseup', () => { isDragging = false;
                win.style.cursor = ''; });

            // ---- 触摸拖拽 ----
            let touchDrag = false,
                tStartX, tStartY, tLeft, tTop;
            titleBar.addEventListener('touchstart', (e) => {
                if (windowData[winId].isMaximized || e.target.closest('.win-controls')) return;
                const touch = e.touches[0];
                touchDrag = true;
                tStartX = touch.clientX;
                tStartY = touch.clientY;
                tLeft = parseInt(win.style.left) || 0;
                tTop = parseInt(win.style.top) || 0;
                e.preventDefault();
            }, { passive: false });
            document.addEventListener('touchmove', (e) => {
                if (!touchDrag) return;
                const touch = e.touches[0];
                win.style.left = (tLeft + touch.clientX - tStartX) + 'px';
                win.style.top = (tTop + touch.clientY - tStartY) + 'px';
                e.preventDefault();
            }, { passive: false });
            document.addEventListener('touchend', () => { touchDrag = false; });

            titleBar.addEventListener('dblclick', () => toggleMaximize(winId));

            focusWindow(winId);
            updateTaskbar();
            return winId;
        }

        function focusWindow(winId) {
            const data = windowData[winId];
            if (!data || data.minimized) return;
            activeWindowId = winId;
            data.element.style.zIndex = ++windowZIndex;
            document.querySelectorAll('.window').forEach(w => w.classList.remove('focus'));
            data.element.classList.add('focus');
            document.querySelectorAll('.task-item').forEach(el => el.classList.remove('active'));
            const taskEl = document.querySelector(`.task-item[data-window-id="${winId}"]`);
            if (taskEl) taskEl.classList.add('active');
        }

        function closeWindow(winId) {
            const data = windowData[winId];
            if (!data) return;
            data.element.remove();
            delete windowData[winId];
            if (activeWindowId === winId) activeWindowId = null;
            updateTaskbar();
            const keys = Object.keys(windowData);
            if (keys.length > 0) focusWindow(keys[keys.length - 1]);
        }

        function minimizeWindow(winId) {
            const data = windowData[winId];
            if (!data) return;
            data.minimized = true;
            data.element.style.display = 'none';
            if (activeWindowId === winId) activeWindowId = null;
            updateTaskbar();
            const keys = Object.keys(windowData);
            for (let i = keys.length - 1; i >= 0; i--) {
                if (!windowData[keys[i]].minimized) { focusWindow(keys[i]); return; }
            }
        }

        function restoreWindow(winId) {
            const data = windowData[winId];
            if (!data || !data.minimized) return;
            data.minimized = false;
            data.element.style.display = 'flex';
            focusWindow(winId);
            updateTaskbar();
        }

        function toggleMaximize(winId) {
            const data = windowData[winId];
            if (!data) return;
            if (data.isMaximized) {
                data.element.classList.remove('maximized');
                data.element.style.width = data.prevRect.width;
                data.element.style.height = data.prevRect.height;
                data.element.style.left = data.prevRect.left;
                data.element.style.top = data.prevRect.top;
                data.isMaximized = false;
            } else {
                data.prevRect = {
                    width: data.element.style.width,
                    height: data.element.style.height,
                    left: data.element.style.left,
                    top: data.element.style.top,
                };
                data.element.classList.add('maximized');
                data.element.style.width = '';
                data.element.style.height = '';
                data.element.style.left = '';
                data.element.style.top = '';
                data.isMaximized = true;
            }
            updateTaskbar();
        }

        function updateTaskbar() {
            const container = document.getElementById('taskItems');
            container.innerHTML = '';
            for (const wid in windowData) {
                const data = windowData[wid];
                const btn = document.createElement('button');
                btn.className = 'task-item' + (data.minimized ? '' : ' active');
                btn.dataset.windowId = wid;
                btn.innerHTML =
                    `${appConfigs[data.app]?.icon || '📱'} ${data.app} <span class="dot"></span>`;
                btn.addEventListener('click', () => {
                    if (data.minimized) restoreWindow(wid);
                    else if (activeWindowId === wid) minimizeWindow(wid);
                    else focusWindow(wid);
                });
                container.appendChild(btn);
            }
        }

        // ================================================================
        //  3. 打开应用
        // ================================================================
        function openApp(appName) {
            if (!appConfigs[appName]) return;
            createWindow(appName);
            document.getElementById('startMenu').classList.remove('open');
        }

        document.querySelectorAll('.desktop-icon').forEach(el => {
            el.addEventListener('click', () => { const app = el.dataset.app; if (app) openApp(app); });
        });
        document.querySelectorAll('.app').forEach(el => {
            el.addEventListener('click', () => { const app = el.dataset.app; if (app) openApp(app); });
        });

        // ================================================================
        //  4. 开始菜单
        // ================================================================
        const startBtn = document.getElementById('startBtn');
        const startMenu = document.getElementById('startMenu');
        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startMenu.classList.toggle('open');
            if (startMenu.classList.contains('open')) document.getElementById('searchBox').focus();
        });
        document.addEventListener('click', (e) => {
            if (!startMenu.contains(e.target) && e.target !== startBtn) startMenu.classList.remove('open');
        });
        document.getElementById('searchBox').addEventListener('input', function() {
            const q = this.value.toLowerCase();
            document.querySelectorAll('#appGrid .app').forEach(el => {
                el.style.display = el.dataset.app.toLowerCase().includes(q) ? '' : 'none';
            });
        });

        // ================================================================
        //  5. 右键菜单（电脑端）
        // ================================================================
        const contextMenu = document.getElementById('contextMenu');
        const desktop = document.getElementById('desktop');

        desktop.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const rect = desktop.getBoundingClientRect();
            let x = e.clientX - rect.left,
                y = e.clientY - rect.top;
            if (x + 200 > rect.width) x = rect.width - 200;
            if (y + 250 > rect.height) y = rect.height - 250;
            contextMenu.style.left = x + 'px';
            contextMenu.style.top = y + 'px';
            contextMenu.style.display = 'block';
        });
        document.addEventListener('click', () => { contextMenu.style.display = 'none'; });
        document.querySelectorAll('.ctx-item').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const action = el.dataset.action;
                if (action === 'refresh') alert('🔄 桌面已刷新');
                else if (action === 'newfolder') alert('📁 新建文件夹');
                else if (action === 'newtxt') alert('📄 新建文本文档.txt');
                else if (action === 'taskmgr') openApp('任务管理器');
                contextMenu.style.display = 'none';
            });
        });

        // ================================================================
        //  6. 手机端长按触发右键菜单
        // ================================================================
        let longPressTimer = null;
        desktop.addEventListener('touchstart', (e) => {
            longPressTimer = setTimeout(() => {
                const touch = e.touches[0];
                const rect = desktop.getBoundingClientRect();
                let x = touch.clientX - rect.left,
                    y = touch.clientY - rect.top;
                if (x + 200 > rect.width) x = rect.width - 200;
                if (y + 250 > rect.height) y = rect.height - 250;
                contextMenu.style.left = x + 'px';
                contextMenu.style.top = y + 'px';
                contextMenu.style.display = 'block';
                e.preventDefault();
            }, 600);
        }, { passive: true });
        desktop.addEventListener('touchend', () => { clearTimeout(longPressTimer); });
        desktop.addEventListener('touchmove', () => { clearTimeout(longPressTimer); });

        // ================================================================
        //  7. ESC 关闭菜单
        // ================================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                startMenu.classList.remove('open');
                contextMenu.style.display = 'none';
            }
        });

        console.log('✅ Windows 11 动态模拟已启动！');
        console.log('📌 支持: 动态壁纸 | 窗口拖拽 | 最大化/最小化/关闭 | 开始菜单 | 右键菜单 | 长按触控');
    </script>

</body>
</html>
